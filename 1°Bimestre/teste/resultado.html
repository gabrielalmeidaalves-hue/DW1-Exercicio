<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Resultado</title>
</head>
<body>

    <h2>Próximo dia:</h2>
    <div id="resposta"></div>

    <script>
        window.onload = function(){
            let params = new URLSearchParams(window.location.search)

            let dia = parseInt(params.get("dia"))
            let mes = parseInt(params.get("mes"))
            let ano = parseInt(params.get("ano"))

            let pdioa = dia + 1

            if(pdioa == 32){
                dia = 1
                mes = mes + 1
                if(mes > 12){
                    mes = 1
                    ano = ano + 1
                }
            } 
            else if(pdioa == 31){
                dia = 1
                mes = mes + 1
                if(mes > 12){
                    mes = 1
                    ano = ano + 1
                }
            } 
            else if(mes == 2 && pdioa == 29){
                dia = 1
                mes = mes + 1
            } 
            else if(mes == 2 && pdioa == 30){
                dia = 1
                mes = mes + 1
            } 
            else {
                dia = dia + 1
            }

            document.getElementById("resposta").innerHTML = dia + "/" + mes + "/" + ano
        }
    </script>

</body>
</html>
