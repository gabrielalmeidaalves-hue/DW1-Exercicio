<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <script src="Autorizacao.js"></script>
    <title>Autorização para viagem</title>
</head>

<body>
    <header>
        <h1>Autorização para viagem</h1>
    </header>

    <main>
        <form action="Destino.html" method="get" onsubmit="return validarFormulario()">

            <div>
                <label for="cpf">CPF:</label>
                <input type="text" id="cpf" name="cpf" maxlength="11" required>
            </div>

            <div>
                <label for="nomeAtleta">Nome do atleta:</label>
                <input type="text" id="nomeAtleta" name="nomeAtleta" required>
            </div>

            <div>           
                <label for="idade">Idade:</label>
                <input type="number" id="idade" name="idade" required>
            </div>

            <div>
                <label for="nomeResponsavel">Nome do responsável:</label>
                <input type="text" id="nomeResponsavel" name="nomeResponsavel" required>
            </div>

            <div>
                <label for="cidadeOrigem">Cidade de origem:</label>
                <input type="text" id="cidadeOrigem" name="cidadeOrigem" required>
            </div>  

            <div>
                <label for="cidadeDestino">Cidade de destino:</label>
                <input type="text" id="cidadeDestino" name="cidadeDestino" required>
            </div>

            <div>
                <label for="modalidade">Modalidade:</label>
                <select name="modalidade" id="modalidade" required>
                    <option value="">Selecione</option>
                    <option value="volei">Vôlei</option>
                    <option value="futsal">Futsal</option>
                    <option value="futebol">Futebol</option>
                    <option value="atletismo">Atletismo</option>
                    <option value="tenis de mesa">Tênis de mesa</option>
                </select>
            </div>

            <button type="submit">Enviar</button>

        </form>
    </main>
</body>
</html>
