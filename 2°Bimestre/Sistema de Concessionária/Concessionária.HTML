<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <title>Sistema de Concessionária Pessoal</title>
    <link rel="stylesheet" href="Concessionária.CSS">
    
</head>

<body>
    <header><img src="/carro1.jpg" alt="veiculo">
    <h1>Sistema de Concessionária Pessoal</h1>
    </header>

    <div class="container">
    <main>
        <section>
        <h3>Listar todos os veículos</h3>
        <input type="button" value="Listar" onclick="FListar_todos()">
        

        <label for="InputBusca">Buscar Veículo:</label>
        <input type="text" id="InputBusca" placeholder="Ex: Civic"><br>
        <input type="button" value="Buscar" onclick="FBuscar_veiculo()">

        <label for="InputCategorias">Escolha uma categoria para listar</label>
        <select name="InputCategorias" id="InputCategorias">
            <option value=""></option>
            <option value="Sedan">Sedan</option>
            <option value="SUV">SUV</option>
            <option value="Hatch">Hatch</option>
            <option value="Picape">Picape</option>
            <option value="Esportivo">Esportivo</option>
            <option value="Motocicleta">Motocicleta</option>
            <option value="Elétrico">Elétrico</option>
            <option value="Van">Van</option>
            <option value="Conversível">Conversível</option>
            <option value="Minivan">Minivan</option>
            
        </select>
           <input type="button" value="Buscar" onclick="FBuscar_categoria()">
        </section>
        

        <div id="RESULTADO" class="resultado"></div>

    </main>
   
   
</div>

    <footer><img src="/Carro2.webp" alt="veiculo">
        Gabriel de Almeida Alves
    </footer>
 
    <script>
        
        const enderecoServidor = 'localhost';
        const porta = '3001';

        
        async function FListar_todos() {
            // Realiza a requisição POST aguardando a resposta da API (fetch)
            try {
                const resposta = await fetch(`http://${enderecoServidor}:${porta}/api/listarVeiculos`, {
                    method: 'POST',             
                    headers: {
                        'Content-Type': 'application/json',  
                    },  
                });
                
              // Converte a resposta bruta do servidor em um array de objetos JSON
                const dados = await resposta.json();
                let html = "<h3>Todos os veículos:</h3>"

               dados.forEach(veiculo => {
                html += `${veiculo.modelo} - ${veiculo.marca} - ${veiculo.ano_fabricacao}<br>`
               });
                
               document.getElementById("RESULTADO").innerHTML = html;

            } catch (erro) {
                
                console.error('Erro:', erro);
                document.getElementById('RESULTADO').innerHTML = "Erro de conexão com o server";
            }
        }

        async function FBuscar_veiculo() {
            try {

                const modelo = document.getElementById("InputBusca").value.trim();

                
                if(!modelo){
                    document.getElementById("RESULTADO").innerHTML = "Digite um modelo para a busca"
                    return
                }
             const letras = modelo.split('');
             let Numero = false;

        for (let i = 0; i < letras.length; i++) {
            if (letras[i] !== ' ' && !isNaN(letras[i])) {
                Numero = true;
                break; 
            }
        }

       
        if (Numero) {
            document.getElementById("RESULTADO").innerHTML = "A busca não permite números. Digite apenas letras.";
            return;
        }
                const resposta = await fetch(`http://${enderecoServidor}:${porta}/api/BuscarVeiculo`, {
                    method: 'POST',             
                    headers: {
                        'Content-Type': 'application/json',  
                    },
                    // Envia o dado do input em formato string JSON no corpo da requisição
                    body: JSON.stringify({ modelo: modelo })
                });
                
              
                const dados = await resposta.json();
                // Verifica se a API retornou uma propriedade de mensagem
                if(dados.mensagem){
                    document.getElementById("RESULTADO").innerHTML = dados.mensagem;
                    return;
                }
                
let html = ""
            dados.forEach(Busca => {
                html += `${Busca.nome_categoria} - ${Busca.modelo} - ${Busca.marca} - ${Busca.ano_fabricacao}<br>`
            });
                
               document.getElementById("RESULTADO").innerHTML = html;

            } catch (erro) {
                
                console.error('Erro:', erro);
                document.getElementById('RESULTADO').innerHTML = "Erro de conexão com o server";
            }
        }


        async function FBuscar_categoria() {
            try {
               const categoria = document.getElementById("InputCategorias").value;

                if(!categoria){
                    document.getElementById("RESULTADO").innerHTML = "Selecione uma categoria para a busca"
                    return
                }


                const resposta = await fetch(`http://${enderecoServidor}:${porta}/api/BuscarCategorias`, {
                    method: 'POST',             
                    headers: {
                        'Content-Type': 'application/json',  
                    },
                     body: JSON.stringify({ categoria: categoria })
                });
                
              
                const dados = await resposta.json();
                if (dados.mensagem) {
                    document.getElementById("RESULTADO").innerHTML = dados.mensagem;
                    return;
                }
                let html = "<h3>Todos os veículos dessa categoria:</h3>"

               dados.forEach(categoria => {
                html +=  `${categoria.nome_categoria} - ${categoria.modelo} - ${categoria.marca} - ${categoria.ano_fabricacao}<br>`
               });
                
               document.getElementById("RESULTADO").innerHTML = html;

            } catch (erro) {
                
                console.error('Erro:', erro);
                document.getElementById('RESULTADO').innerHTML = "Erro de conexão com o server";
            }
        }
        
        document.getElementById('InputBusca').addEventListener('keypress', function(event) {
            if (event.key === 'Enter') {
                FBuscar_veiculo();
            }
        });
    </script>
</body>

</html>
