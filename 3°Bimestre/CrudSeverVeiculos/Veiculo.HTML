<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRUD Veiculo - Banco de Dados</title>
    <link rel="stylesheet" href="Veiculo.CSS">
</head>

<body onload="listar()">

    <div class="container">
        <h1>Cadastro de Veiculos</h1>

        <label for="id_veiculo">id_veiculo</label>
        <input type="text" name="id_veiculo" id="id_veiculo">
        <input type="button" value="Procure" id="btProcure" onclick="procure()" style="display:inline;">
        <input type="button" value="Inserir" id="btInserir" onclick="inserir()" style="display:none;">
        <input type="button" value="Alterar" id="btAlterar" onclick="alterar()" style="display:none;">
        <input type="button" value="Excluir" id="btExcluir" onclick="excluir()" style="display:none;">

        <label for="marca">marca</label>
        <input type="text" name="marca" id="marca">

        <label for="modelo">modelo</label>
        <input type="text" name="modelo" id="modelo">

        <label for="ano_fabricacao">ano_fabricacao</label>
        <input type="number" name="ano_fabricacao" id="ano_fabricacao">

        <label for="cor">cor</label>
        <input type="text" name="cor" id="cor">

        <label for="placa">placa</label>
        <input type="text" name="placa" id="placa">

        <div id="divAviso">Informe o ID e clique em Procure</div>

        <input type="button" value="Salvar" id="btSalvar" onclick="salvar()" style="display:none;">
        <input type="button" value="Cancelar" id="btCancelar" onclick="cancelarOperacao()" style="display:none;">

        <h3>Veiculos Cadastrados:</h3>
        <div id="outputSaida">Carregando...</div>
    </div>


    <script src="./VeiculoControle.js"></script>
</body>

</html>
